name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Science APK with permanent signing key
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1"

      - name: Load and verify permanent Science signing key
        env:
          SCIENCE_KEYSTORE_BASE64: ${{ secrets.SCIENCE_KEYSTORE_BASE64 }}
          SCIENCE_KEYSTORE_PASSWORD: ${{ secrets.SCIENCE_KEYSTORE_PASSWORD }}
          SCIENCE_KEY_ALIAS: ${{ secrets.SCIENCE_KEY_ALIAS }}
          SCIENCE_KEY_PASSWORD: ${{ secrets.SCIENCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SCIENCE_KEYSTORE_BASE64 SCIENCE_KEYSTORE_PASSWORD SCIENCE_KEY_ALIAS SCIENCE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Science signing secret is missing: $name"
              exit 1
            fi
          done

          printf '%s' "$SCIENCE_KEYSTORE_BASE64" | base64 --decode > science-signing.keystore
          test -s science-signing.keystore
          keytool -list -v -keystore science-signing.keystore \
            -storepass "$SCIENCE_KEYSTORE_PASSWORD" -alias "$SCIENCE_KEY_ALIAS" \
            > science-signing-certificate.txt

          echo "Verified Science signing certificate:"
          grep -E 'SHA1:|SHA256:' science-signing-certificate.txt
          {
            echo "SCIENCE_KEYSTORE_PATH=$GITHUB_WORKSPACE/science-signing.keystore"
            echo "SCIENCE_KEYSTORE_PASSWORD=$SCIENCE_KEYSTORE_PASSWORD"
            echo "SCIENCE_KEY_ALIAS=$SCIENCE_KEY_ALIAS"
            echo "SCIENCE_KEY_PASSWORD=$SCIENCE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sslc-science-ai-teacher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
